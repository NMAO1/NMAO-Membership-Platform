<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NMAO - Choose a Plan</title>
<style>
  :root{
    --accent:#c8a24a; --bg:#0f1115; --surface:#1a1d24; --border:#2a2f3a;
    --text:#f4f5f7; --muted:#9aa0ab; --accent-text:#101216;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:460px;margin:0 auto;padding:28px 20px 48px;min-height:100vh;display:flex;flex-direction:column}
  .brandhead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .brandhead img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--surface)}
  .brandhead .name{font-weight:700;font-size:1.05rem}
  h1{font-size:1.35rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 18px}
  .plan{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:15px;margin-bottom:11px;cursor:pointer;transition:border-color .15s}
  .plan.sel{border-color:var(--accent)}
  .plan .pn{flex:1}
  .plan .pname{font-weight:600}
  .plan .pmeta{color:var(--muted);font-size:.82rem;margin-top:2px}
  .plan .price{color:var(--accent);font-weight:700;white-space:nowrap}
  .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto}
  .plan.sel .radio{border-color:var(--accent);background:radial-gradient(circle at center,var(--accent) 0 6px,transparent 7px)}
  button{width:100%;padding:15px;border:none;border-radius:12px;background:var(--accent);
    color:var(--accent-text);font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{font-size:.9rem;margin:12px 0 0;padding:11px 13px;border-radius:9px;display:none}
  .msg.err{display:block;background:#3a1d1d;color:#ffb4b4;border:1px solid #5a2a2a}
  .msg.ok{display:block;background:#173a24;color:#a9f0c1;border:1px solid #275a3a}
  .hide{display:none!important}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.25);
    border-top-color:var(--accent-text);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{color:var(--muted);font-size:.72rem;text-align:center;margin-top:auto;padding-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandhead"><img id="brandLogo" alt="" class="hide" /><div class="name" id="brandName">NMAO</div></div>

  <div id="done" class="hide">
    <h1>Payment complete</h1>
    <p class="sub">The membership is active. You can close this page.</p>
  </div>

  <div id="cancelled" class="hide">
    <h1>Checkout cancelled</h1>
    <p class="sub">No payment was taken. You can pick a plan again below.</p>
  </div>

  <div id="picker">
    <h1>Choose a plan</h1>
    <p class="sub" id="forLine">Select a membership to enroll.</p>
    <div id="plans"><div class="sub"><span class="spin"></span> Loading plans...</div></div>
    <button id="goBtn" disabled>Continue to payment</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="foot">Payments are processed securely by Stripe. NMAO never stores card numbers.</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ykiozrdwudawpxdzbbyc.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlraW96cmR3dWRhd3B4ZHpiYnljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTAwODQsImV4cCI6MjA5MDYyNjA4NH0.MRv1FnXUpGA0wEWe4cW6lSQFcNb7W0Y_nErSZe1hr8c';
const sb = createClient(SUPABASE_URL, ANON);

const P = new URLSearchParams(location.search);
const slug = P.get('s') || '';
const SID  = P.get('sid') || '';
const STU  = P.get('stu') || '';
const $ = (id) => document.getElementById(id);
function money(n){ return '$' + (Number(n) || 0).toFixed(2); }

// Return states from Stripe redirect.
if(P.get('paid') === '1'){ $('picker').classList.add('hide'); $('done').classList.remove('hide'); }
else if(P.get('cancelled') === '1'){ $('cancelled').classList.remove('hide'); }

// Optional branding.
(async function brand(){
  if(!slug) return;
  try{
    const { data } = await sb.rpc('get_school_branding_by_slug', { p_slug: slug });
    const b = Array.isArray(data) ? data[0] : data;
    if(!b) return;
    const r = document.documentElement.style;
    if(b.color) r.setProperty('--accent', b.color);
    if(b.bg_color) r.setProperty('--bg', b.bg_color);
    if(b.surface_color) r.setProperty('--surface', b.surface_color);
    if(b.border_color) r.setProperty('--border', b.border_color);
    if(b.font_color) r.setProperty('--text', b.font_color);
    if(b.name) $('brandName').textContent = b.name;
    if(b.logo_url){ $('brandLogo').src = b.logo_url; $('brandLogo').classList.remove('hide'); }
  }catch(e){}
})();

let selected = null;
let plans = [];

async function loadPlans(){
  if(!SID){ $('plans').innerHTML = '<div class="msg err" style="display:block">Missing school.</div>'; return; }
  try{
    const { data, error } = await sb.rpc('get_public_memberships', { p_school_id: SID });
    if(error) throw error;
    plans = (data || []).filter(m => m && !m.is_custom);
    if(!plans.length){ $('plans').innerHTML = '<div class="sub">No plans are published yet. Add one in the dashboard.</div>'; return; }
    render();
  }catch(e){
    $('plans').innerHTML = '<div class="msg err" style="display:block">' + ((e && e.message) || 'Could not load plans.') + '</div>';
  }
}

function render(){
  let html = '';
  plans.forEach((m) => {
    const price = parseFloat(m.price) || 0;
    const fee = parseFloat(m.signup_fee) || 0;
    let meta = m.billing_type === 'class_pack'
      ? ((m.class_limit_count ? (m.class_limit_count + '-class pack') : 'Class pack'))
      : (m.billing_type === 'recurring' ? 'Monthly membership' : 'Membership');
    if(fee > 0) meta += ' + ' + money(fee) + ' signup';
    const sel = (selected === m.id) ? ' sel' : '';
    html += '<div class="plan' + sel + '" data-id="' + m.id + '">' +
      '<div class="pn"><div class="pname"></div><div class="pmeta"></div></div>' +
      '<div class="price">' + money(price) + '</div><div class="radio"></div></div>';
    // Fill text safely below to avoid HTML injection from names.
  });
  $('plans').innerHTML = html;
  // Populate names/meta as text (no innerHTML for user data).
  const nodes = $('plans').querySelectorAll('.plan');
  nodes.forEach((node, i) => {
    const m = plans[i];
    node.querySelector('.pname').textContent = m.name || 'Membership';
    const price = parseFloat(m.price) || 0, fee = parseFloat(m.signup_fee) || 0;
    let meta = m.billing_type === 'class_pack'
      ? ((m.class_limit_count ? (m.class_limit_count + '-class pack') : 'Class pack'))
      : (m.billing_type === 'recurring' ? 'Monthly membership' : 'Membership');
    if(fee > 0) meta += ' + ' + money(fee) + ' signup';
    node.querySelector('.pmeta').textContent = meta;
    node.onclick = () => { selected = m.id; render(); $('goBtn').disabled = false; };
  });
}

$('goBtn').onclick = async () => {
  if(!selected){ return; }
  if(!STU){ setMsg('This checkout needs a student. Re-open it from the student.', 'err'); return; }
  $('goBtn').disabled = true;
  $('goBtn').innerHTML = '<span class="spin"></span> Starting checkout...';
  setMsg('', '');
  try{
    const base = location.origin + location.pathname + '?s=' + encodeURIComponent(slug) + '&sid=' + encodeURIComponent(SID) + '&stu=' + encodeURIComponent(STU);
    const body = {
      school_id: SID, student_id: STU, membership_id: selected,
      success_url: base + '&paid=1', cancel_url: base + '&cancelled=1'
    };
    const r = await fetch(SUPABASE_URL + '/functions/v1/stripe-create-checkout', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + ANON }, body: JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({}));
    if(!r.ok || !d || d.error || !d.url) throw new Error((d && d.error) || 'Could not start checkout.');
    location.href = d.url;
  }catch(e){
    setMsg((e && e.message) || 'Could not start checkout.', 'err');
    $('goBtn').disabled = false; $('goBtn').innerHTML = 'Continue to payment';
  }
};

function setMsg(txt, kind){ const el = $('msg'); el.textContent = txt || ''; el.className = 'msg' + (txt ? (' ' + kind) : ''); }

if(P.get('paid') !== '1'){ loadPlans(); }
</script>
</body>
</html>
